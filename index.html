<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ফয়জুন্নেছা ইসলামিয়া মহিলা মাদ্রাসা</title>

<style>
body{margin:0;font-family:Arial;background:#f2f5f2}
header{
background:linear-gradient(rgba(0,90,40,.8),rgba(0,90,40,.8)),
url('https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=1400&q=80');
background-size:cover;
color:white;
text-align:center;
padding:60px 20px;
}
nav{
background:#006400;
padding:10px;
text-align:center;
}
nav button{
padding:10px 15px;
margin:4px;
border:none;
border-radius:5px;
cursor:pointer;
}
.page{
display:none;
padding:20px;
background:white;
margin:15px;
border-radius:10px;
}
input,select{
width:100%;
padding:10px;
margin:6px 0;
}
.submit{
background:#006400;
color:white;
border:none;
padding:10px;
width:100%;
}
</style>
</head>

<body>

<header>
<h1>🕌 ফয়জুন্নেছা ইসলামিয়া মহিলা মাদ্রাসা</h1>
<p>মধুখালী, ফরিদপুর</p>
<p>প্রতিষ্ঠাতা পরিচালক: মাওলানা শামসুল হক</p>
<p>📞 ০১৭২৫৩০৪৭১৪</p>
</header>

<nav>
<button onclick="showPage('home')">হোম</button>
<button onclick="showPage('register')">রেজিস্ট্রেশন</button>
<button onclick="showPage('login')">লগইন</button>
<button onclick="showPage('admission')">ভর্তি</button>
<button onclick="showPage('payment')">পেমেন্ট</button>
</nav>

<div id="home" class="page" style="display:block">
<h2>স্বাগতম</h2>
<p>মক্তব, নাজেরা ও জামাত বিভাগে ভর্তি চলছে।</p>
</div>

<div id="register" class="page">
<h2>রেজিস্ট্রেশন</h2>
<input id="regMobile" placeholder="মোবাইল">
<input id="regPass" type="password" placeholder="পাসওয়ার্ড">
<button class="submit" onclick="registerUser()">রেজিস্ট্রেশন করুন</button>
</div>

<div id="login" class="page">
<h2>লগইন</h2>
<input id="loginMobile" placeholder="মোবাইল">
<input id="loginPass" type="password" placeholder="পাসওয়ার্ড">
<button class="submit" onclick="loginUser()">লগইন করুন</button>
<p id="loginMsg"></p>
</div>

<div id="admission" class="page">
<h2>অনলাইন ভর্তি আবেদন</h2>
<input placeholder="শিক্ষার্থীর নাম">

<select>
<option>বিভাগ নির্বাচন করুন</option>
<option>মক্তব</option>
<option>নাজেরা</option>
<option>ইবতেদায়ী</option>
<option>মিজান</option>
<option>নাহবেমীর</option>
<option>কুদুরী</option>
<option>শরহে বেকায়া</option>
<option>হেদায়া</option>
<option>মিশকাত</option>
</select>

<input placeholder="অভিভাবকের মোবাইল">
<button class="submit">আবেদন জমা দিন</button>
</div>

<div id="payment" class="page">
<h2>পেমেন্ট</h2>
<p>বিকাশ: ০১৭২৫৩০৪৭১৪</p>
<input id="trx" placeholder="Transaction ID">
<button class="submit" onclick="pay()">জমা দিন</button>
<p id="payMsg"></p>
</div>

<script>
function showPage(id){
document.querySelectorAll('.page').forEach(p=>p.style.display='none');
document.getElementById(id).style.display='block';
}

function registerUser(){
let mobile=document.getElementById('regMobile').value;
let pass=document.getElementById('regPass').value;
localStorage.setItem('mobile',mobile);
localStorage.setItem('pass',pass);
alert('রেজিস্ট্রেশন সফল');
}

function loginUser(){
let m=document.getElementById('loginMobile').value;
let p=document.getElementById('loginPass').value;

if(m===localStorage.getItem('mobile') &&
p===localStorage.getItem('pass')){
document.getElementById('loginMsg').innerHTML="✅ লগইন সফল";
}else{
document.getElementById('loginMsg').innerHTML="❌ ভুল তথ্য";
}
}

function pay(){
let trx=document.getElementById('trx').value;
document.getElementById('payMsg').innerHTML=
"✅ পেমেন্ট তথ্য গ্রহণ করা হয়েছে। TRX: "+trx;
}
</script>

</body>
</html>
